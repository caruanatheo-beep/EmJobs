name: Collecter et publier les offres

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Toutes les 2 heures, de 6 h à 22 h environ (heure de Paris).
    - cron: '17 5-21/2 * * *'

permissions:
  contents: read

concurrency:
  group: em-jobs-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      PREVIOUS_OFFERS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/offers.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: Vérifier la configuration et le moteur
        run: python -m pytest -q
      - name: Récupérer les logos des nouvelles entreprises
        run: python -m emjobs.logos
      - name: Collecter les offres et construire le site
        run: python -m emjobs.build --collect --output _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
