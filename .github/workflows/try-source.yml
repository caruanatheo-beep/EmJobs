name: Tester une entreprise

# Lancer depuis Actions → « Tester une entreprise » → Run workflow.
# Rien n'est publié : le résultat s'affiche dans le journal de l'exécution.
on:
  workflow_dispatch:
    inputs:
      boards:
        description: "Outil:identifiant, séparés par des virgules (ex. ashby:doctolib, lever:theodo)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  try:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Tester
        env:
          BOARDS: ${{ inputs.boards }}
        run: python -m emjobs.try_source "$BOARDS" | tee -a "$GITHUB_STEP_SUMMARY"
