# Entreprises suivies par Em Jobs.
#
# Pour ajouter une entreprise, copie un bloc [[source]] et change les valeurs :
#   nom      : nom affiché sur le site
#   ats      : outil de recrutement utilisé par l'entreprise
#              (greenhouse, lever, ashby, smartrecruiters ou workday)
#   slug     : identifiant de l'entreprise dans cet outil, visible dans l'URL
#              de sa page carrière (ex. jobs.ashbyhq.com/doctolib -> doctolib)
#   secteur  : regroupement affiché dans les filtres et l'onglet Sources
#   domaine  : site de l'entreprise, utilisé pour son logo
#   ia       : true si l'entreprise fait de l'IA son cœur de métier (bonus de pertinence)
#
# Pour Workday, le slug s'écrit "hôte/tenant/site", par exemple
#   nvidia.wd5.myworkdayjobs.com/nvidia/NVIDIAExternalCareerSite
#
# Pour retirer une entreprise sans la supprimer, ajoute : actif = false
# Le guide COMMENT_MODIFIER.md explique comment trouver l'ATS d'une entreprise.

